name: Diagnose GeM connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test GeM over curl and Node
        run: |
          curl -4 -L --max-time 30 -sS -o /tmp/gem.html -w 'curl_ipv4_http=%{http_code} bytes=%{size_download}\n' https://bidplus.gem.gov.in/all-bids || true
          curl -6 -L --max-time 30 -sS -o /tmp/gem6.html -w 'curl_ipv6_http=%{http_code} bytes=%{size_download}\n' https://bidplus.gem.gov.in/all-bids || true
          node -e "fetch('https://bidplus.gem.gov.in/all-bids',{signal:AbortSignal.timeout(30000)}).then(async r=>console.log('node_http='+r.status+' bytes='+(await r.text()).length)).catch(e=>{console.error(e);console.error(e.cause)})"
