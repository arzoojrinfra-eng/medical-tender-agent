name: Check Document Worker Connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Check AI and official PDF connectivity
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python documents/probe.py
